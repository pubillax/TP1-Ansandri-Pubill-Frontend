<h2>ABM Equipos</h2>

<form [formGroup]="equipoForm" (ngSubmit)="guardar()" class="form-container">
  <label for="usuario">Usuario:</label>
  <select id="usuario" formControlName="usernameUsuario">
    <option *ngFor="let usuario of usuarios" [value]="usuario.email">
      {{ usuario.email }}
    </option>
  </select>

  <label for="username">Nombre del equipo:</label>
  <input id="username" formControlName="username" />

  <button type="submit">{{ editandoId ? 'Actualizar' : 'Crear' }}</button>
  <button type="button" (click)="cancelar()" *ngIf="editandoId">Cancelar</button>
</form>

<hr />

<h3>Lista de Equipos</h3>
<ul>
  <li *ngFor="let equipo of equipos">
    {{ equipo.username }} (Usuario: {{ equipo.usernameUsuario }})
    <button (click)="editar(equipo)">Editar</button>
    <button *ngIf="equipo._id" (click)="eliminar(equipo._id)">Eliminar</button>
  </li>
</ul>
